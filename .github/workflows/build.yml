name: Build & Package

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build macOS App & DMG
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Show Swift Version & Environment
        run: |
          swift --version
          xcodebuild -version

      - name: Build Application & DMG Installer
        run: |
          chmod +x scripts/build_app.sh scripts/build_dmg.sh
          ./scripts/build_dmg.sh

      - name: Compress App Bundle
        run: |
          zip -r -y NoteNote.app.zip NoteNote.app

      - name: Upload DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NoteNote-DMG
          path: NoteNote.dmg
          retention-days: 14

      - name: Upload App Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NoteNote-macOS-App
          path: NoteNote.app.zip
          retention-days: 14

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            NoteNote.dmg
            NoteNote.app.zip
          generate_release_notes: true
